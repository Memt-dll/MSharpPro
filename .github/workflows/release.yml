# main dalına her push'ta (ve v* etiketlerinde) yeni bir sürüm derler:
#   - sürüm numarası otomatik artar (csproj'daki Major.Minor + çalıştırma numarası, ör. 1.0.7)
#   - kurulum dosyası GitHub Releases'a eklenir -> uygulamalar saatte bir denetleyip kendini günceller
#   - repodaki Setup/MSharpPro-Setup.exe de güncellenir
# Yalnızca README / Setup değişikliklerinde yeni sürüm çıkmaz.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'Setup/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Sürümü belirle
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $base = ([xml](Get-Content MSharpPro.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $p = $base.Split('.')
            $v = "$($p[0]).$($p[1]).${{ github.run_number }}"
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Geçersiz sürüm: $v" }
          "VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "Sürüm: $v"

      - name: Inno Setup kur
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Kurulum dosyasını derle
        shell: pwsh
        run: ./build-installer.ps1 -Version $env:VERSION

      - name: Yapıtı sakla
        uses: actions/upload-artifact@v4
        with:
          name: MSharpPro-Setup
          path: dist/*.exe

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: M#Pro ${{ env.VERSION }}
          files: dist/*.exe
          generate_release_notes: true
          make_latest: true

      # Repodaki Setup/MSharpPro-Setup.exe dosyasını yeni sürümle güncelle,
      # böylece repo sayfasından indirilen kurulum hep en güncel olur.
      # (GITHUB_TOKEN ile yapılan push yeni bir iş akışı tetiklemez, döngü oluşmaz.)
      - name: Setup klasörünü güncelle
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main
          New-Item -ItemType Directory -Force Setup | Out-Null
          Copy-Item "dist/MSharpPro-Setup-$env:VERSION.exe" Setup/MSharpPro-Setup.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Setup/MSharpPro-Setup.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Kurulum dosyası $env:VERSION sürümüne güncellendi [skip ci]"
            for ($i = 0; $i -lt 3; $i++) {
              git push origin main
              if ($LASTEXITCODE -eq 0) { break }
              git pull --rebase origin main
            }
          }
          exit 0
