# Bir sürüm etiketi (ör. v1.0.0) push edildiğinde kurulum dosyasını üretir
# ve GitHub Releases sayfasına yükler. Actions sekmesinden elle de çalıştırılabilir.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Sürümü belirle
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = '1.0.0' }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Inno Setup kur
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Kurulum dosyasını derle
        shell: pwsh
        run: ./build-installer.ps1 -Version $env:VERSION

      - name: Yapıtı sakla
        uses: actions/upload-artifact@v4
        with:
          name: MSharpPro-Setup
          path: dist/*.exe

      - name: GitHub Release oluştur
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: M#Pro ${{ env.VERSION }}
          files: dist/*.exe
          generate_release_notes: true

      # Repodaki Setup/MSharpPro-Setup.exe dosyasını yeni sürümle güncelle,
      # böylece repo sayfasından indirilen kurulum hep en güncel olur.
      - name: Setup klasörünü güncelle
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main
          New-Item -ItemType Directory -Force Setup | Out-Null
          Copy-Item "dist/MSharpPro-Setup-$env:VERSION.exe" Setup/MSharpPro-Setup.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Setup/MSharpPro-Setup.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Kurulum dosyası $env:VERSION sürümüne güncellendi [skip ci]"
            git push origin main
          }
          exit 0
